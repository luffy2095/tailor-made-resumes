name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install poppler (PNG previews and the ATS text check)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -q && sudo apt-get install -y -q poppler-utils ;;
            macOS)   brew install poppler ;;
            Windows) choco install poppler -y --no-progress ;;
          esac

      - name: Setup (installs TinyTeX, adds packages, compiles a test page)
        run: python -u scripts/setup.py

      - name: Report the TinyTeX install size
        shell: bash
        run: |
          for d in "$HOME/.TinyTeX" "$HOME/Library/TinyTeX" "$APPDATA/TinyTeX"; do
            if [ -d "$d" ]; then du -sh "$d"; fi
          done

      - name: Self-test (every example, every template, the ATS ligature guard)
        run: python -u scripts/selftest.py
